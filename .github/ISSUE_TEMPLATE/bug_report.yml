        - opensre
        - openwork
        - openworker
        - ouroboros
        - p2p-kiwi
        - pdf-brain
        - pentesterflow
        - pi
        - pilotdeck
        - pixi
        - pkl
        - posthog-cli
        - qodo-cover
        - qwen-audio-agent
        - qwen-code
        - rescript-editor
        - servoshell
        - sql-studio
