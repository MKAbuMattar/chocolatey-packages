---
name: Bug report
description: Create a report to help us improve
labels: ["bug"]
assignees: [""]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is this about?
      options:
        - agent-orchestrator
        - anythingllm
        - bananas
        - cdxgen
        - colibri
        - dashbeam
        - daytona
        - deepchat
        - dyad
        - e2ecp
        - faceswap
        - github-mcp-server
        - grepai
        - iam-policy-autopilot
        - jqp
        - kortix
        - llmfit
        - lmstudio
        - lobehub
        - meetily
        - mindwalk
        - neohtop
        - nub
        - octobot
        - onlook
        - openclaw-companion
        - opencodereview
        - openwork
        - openworker
        - ouroboros
        - pi
        - pixi
        - pkl
        - posthog-cli
        - qodo-cover
        - qwen-code
        - servoshell
        - strix
        - t3-code
        - tailspin
        - terax
        - tiny-rdm
        - tuios
        - txm
        - vercel-native
        - whisper-cpp
        - whosthere
        - winapp
        - witsy
        - worldmonitor
        - xleak
        - ytsage
        - the repository itself
    validations:
      required: true

  - type: textarea
    id: concise-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: What is the bug about?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: How do we reproduce it?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots or logs to help explain.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context about the problem here.
    validations:
      required: false
