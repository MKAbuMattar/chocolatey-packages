name: Update and publish packages

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to check, space separated. Blank means all of them."
        required: false
        default: ""
      force:
        description: "Rebuild even when there is no new version (dry run, pushes nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Chocolatey AU
        run: choco install chocolatey-au --yes --no-progress

      # The update step only pushes when upstream is newer than the nuspec, so a package
      # added at upstream's latest version, or bumped by hand, never published. This
      # pushes any package whose committed version the gallery has never seen. It runs
      # first so it publishes what is committed, before AU moves anything, and forced
      # runs skip it because they are dry runs.
      - name: Publish versions the gallery has never seen
        if: ${{ inputs.force != true }}
        shell: powershell
        env:
          api_key: ${{ secrets.CHOCO_API_KEY }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          $names = $Env:PACKAGES -split '\s+' -ne ''
          .\publish_missing.ps1 -Name $names

      # Runs even when the publish step failed: a package that could not be published
      # is no reason to stop every other package from updating.
      - name: Update packages
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          api_key: ${{ secrets.CHOCO_API_KEY }}
          au_Push: "true"
          github_api_key: ${{ secrets.GITHUB_TOKEN }}
          github_user_repo: ${{ github.repository }}
          PACKAGES: ${{ inputs.packages }}
          FORCE: ${{ inputs.force }}
        run: |
          $names = $Env:PACKAGES -split '\s+' -ne ''
          .\update_all.ps1 -Name $names -Force:($Env:FORCE -eq 'true')

      - name: Publish report
        if: always()
        shell: powershell
        run: Get-Content Update-AUPackages.md -ErrorAction Ignore | Add-Content $Env:GITHUB_STEP_SUMMARY
